<div class="min-h-screen bg-slate-50 px-6 py-8">
  <div class="mx-auto max-w-2xl">

    <div class="mb-8">
      <h1 class="text-3xl font-bold text-slate-900">
        Create Venue
      </h1>

      <p class="mt-2 text-slate-600">
        Add a new venue for upcoming events.
      </p>
    </div>

    <div class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">

      @if (successMessage()) {
        <div class="mb-6 rounded-lg bg-emerald-50 p-4 text-sm font-medium text-emerald-700">
          {{ successMessage() }}
        </div>
      }

      @if (errorMessage()) {
        <div class="mb-6 rounded-lg bg-red-50 p-4 text-sm font-medium text-red-700">
          {{ errorMessage() }}
        </div>
      }

      <form (ngSubmit)="saveVenue()">

        <!-- Venue Name -->
        <div class="mb-5">
          <label
            for="venue-name"
            class="mb-2 block text-sm font-semibold text-slate-700">
            Venue Name
          </label>

          <input
            id="venue-name"
            type="text"
            name="name"
            [(ngModel)]="venue.name"
            placeholder="Enter venue name"
            class="w-full rounded-xl border border-slate-300 bg-white px-4 py-3 text-sm outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200"
          />
        </div>

        <!-- Address -->
        <div class="mb-5">
          <label
            for="venue-address"
            class="mb-2 block text-sm font-semibold text-slate-700">
            Address
          </label>

          <textarea
            id="venue-address"
            name="address"
            [(ngModel)]="venue.address"
            rows="3"
            placeholder="Enter venue address"
            class="w-full rounded-xl border border-slate-300 bg-white px-4 py-3 text-sm outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200"></textarea>
        </div>

        <!-- Capacity -->
        <div class="mb-5">
          <label
            for="venue-capacity"
            class="mb-2 block text-sm font-semibold text-slate-700">
            Total Capacity
          </label>

          <input
            id="venue-capacity"
            type="number"
            name="totalCapacity"
            [(ngModel)]="venue.totalCapacity"
            min="1"
            placeholder="Enter total capacity"
            class="w-full rounded-xl border border-slate-300 bg-white px-4 py-3 text-sm outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200"
          />
        </div>

        <!-- Parking Slots Breakdown -->
        <div class="mb-6 rounded-xl border border-slate-200 bg-slate-50/50 p-5">
          <div class="mb-4 flex items-center justify-between">
            <h3 class="text-sm font-bold uppercase tracking-wider text-slate-700">
              Parking Capacity Breakdown
            </h3>
            <span class="rounded-full bg-emerald-100 px-3 py-1 text-xs font-semibold text-emerald-800">
              Total Slots: {{ computedTotalParkingSlots }}
            </span>
          </div>

          <div class="grid grid-cols-2 gap-4">
            <!-- Car Capacity -->
            <div>
              <label for="car-capacity" class="mb-1 block text-xs font-semibold text-slate-600">
                🚗 Car Slots
              </label>
              <input
                id="car-capacity"
                type="number"
                name="carCapacity"
                [(ngModel)]="venue.carCapacity"
                (ngModelChange)="updateTotalSlots()"
                min="0"
                placeholder="0"
                class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200"
              />
            </div>

            <!-- Bike Capacity -->
            <div>
              <label for="bike-capacity" class="mb-1 block text-xs font-semibold text-slate-600">
                🏍️ Bike Slots
              </label>
              <input
                id="bike-capacity"
                type="number"
                name="bikeCapacity"
                [(ngModel)]="venue.bikeCapacity"
                (ngModelChange)="updateTotalSlots()"
                min="0"
                placeholder="0"
                class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200"
              />
            </div>

            <!-- Bus Capacity -->
            <div>
              <label for="bus-capacity" class="mb-1 block text-xs font-semibold text-slate-600">
                🚌 Bus Slots
              </label>
              <input
                id="bus-capacity"
                type="number"
                name="busCapacity"
                [(ngModel)]="venue.busCapacity"
                (ngModelChange)="updateTotalSlots()"
                min="0"
                placeholder="0"
                class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200"
              />
            </div>

            <!-- Van Capacity -->
            <div>
              <label for="van-capacity" class="mb-1 block text-xs font-semibold text-slate-600">
                🚐 Van Slots
              </label>
              <input
                id="van-capacity"
                type="number"
                name="vanCapacity"
                [(ngModel)]="venue.vanCapacity"
                (ngModelChange)="updateTotalSlots()"
                min="0"
                placeholder="0"
                class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200"
              />
            </div>
          </div>
        </div>

        <!-- Submit -->
        <button
          type="submit"
          [disabled]="isSaving()"
          class="w-full rounded-xl bg-indigo-600 px-5 py-3 text-sm font-semibold text-white transition hover:bg-indigo-700 disabled:cursor-not-allowed disabled:opacity-60">

          @if (isSaving()) {
            Creating Venue...
          } @else {
            Create Venue
          }

        </button>

      </form>

    </div>

  </div>
</div>
