<div class="min-h-screen bg-slate-50 px-4 py-8 sm:px-6 lg:px-8">
  <div class="mx-auto max-w-xl">

    <!-- Header -->
    <header class="mb-8">
      <button
        type="button"
        (click)="goBack()"
        class="inline-flex items-center gap-1.5 text-xs font-bold text-slate-500 hover:text-blue-600 transition mb-3 cursor-pointer"
      >
        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m15 18-6-6 6-6"/>
        </svg>
        <span>Back to Categories</span>
      </button>

      <p class="text-xs font-bold uppercase tracking-widest text-blue-600">
        EVENTRA · ADMIN
      </p>
      <h1 class="mt-1 text-3xl font-extrabold text-slate-950 tracking-tight">
        Edit Category
      </h1>
      <p class="mt-1 text-sm text-slate-500">
        Update classification name and descriptive details for this category.
      </p>
    </header>

    @if (isLoading()) {
      <div class="py-16 flex justify-center">
        <app-loading-spinner message="Loading category details..."></app-loading-spinner>
      </div>
    }

    @if (!isLoading()) {
      <!-- Form Card -->
      <div class="rounded-3xl border border-slate-200 bg-white p-6 sm:p-8 shadow-xs">

        @if (successMessage()) {
          <div class="mb-6 rounded-2xl border border-emerald-200 bg-emerald-50 p-4 text-xs font-bold text-emerald-800 flex items-center gap-2">
            <span>✓</span>
            <span>{{ successMessage() }}</span>
          </div>
        }

        @if (errorMessage()) {
          <div class="mb-6">
            <app-error-message [message]="errorMessage()"></app-error-message>
          </div>
        }

        <form (ngSubmit)="updateCategory()" #categoryEditForm="ngForm" class="space-y-6">

          <!-- 1. Category Name -->
          <div>
            <label for="edit-cat-name" class="mb-2 block text-xs font-bold uppercase tracking-wider text-slate-700">
              Category Name <span class="text-rose-600">*</span>
            </label>
            <input
              id="edit-cat-name"
              type="text"
              name="name"
              [(ngModel)]="category.name"
              required
              class="w-full rounded-xl border border-slate-300 bg-white px-4 py-3 text-sm text-slate-800 shadow-2xs outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
            />
          </div>

          <!-- 2. Description -->
          <div>
            <label for="edit-cat-desc" class="mb-2 block text-xs font-bold uppercase tracking-wider text-slate-700">
              Description
            </label>
            <textarea
              id="edit-cat-desc"
              name="description"
              [(ngModel)]="category.description"
              rows="3"
              class="w-full rounded-xl border border-slate-300 bg-white px-4 py-3 text-sm text-slate-800 shadow-2xs outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
            ></textarea>
          </div>

          <!-- Actions -->
          <div class="pt-4 border-t border-slate-100 flex items-center justify-end gap-3">
            <button
              type="button"
              (click)="goBack()"
              [disabled]="isSaving()"
              class="rounded-xl border border-slate-200 bg-white px-5 py-2.5 text-xs font-bold text-slate-700 hover:bg-slate-50 transition cursor-pointer disabled:opacity-50"
            >
              Cancel
            </button>

            <button
              type="submit"
              [disabled]="isSaving()"
              class="rounded-xl bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 px-6 py-2.5 text-xs font-bold text-white shadow-xs transition active:scale-[0.98] disabled:cursor-not-allowed disabled:opacity-60 cursor-pointer flex items-center gap-2"
            >
              @if (isSaving()) {
                <span class="h-3.5 w-3.5 border-2 border-white/40 border-t-white rounded-full animate-spin"></span>
                <span>Saving Changes...</span>
              } @else {
                <span>Save Changes</span>
              }
            </button>
          </div>

        </form>
      </div>
    }

  </div>
</div>
