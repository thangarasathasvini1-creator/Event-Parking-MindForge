<div class="min-h-screen bg-slate-50 px-6 py-8">
  <div class="mx-auto max-w-4xl">

    <!-- Header -->
    <div class="mb-8">
      <h1 class="text-3xl font-bold text-slate-900">
        Create Event
      </h1>

      <p class="mt-2 text-slate-600">
        Add a new event with venue, category, schedule, pricing,
        and capacity details.
      </p>
    </div>

    <!-- Success -->
    @if (successMessage()) {
      <div
        class="mb-6 rounded-xl border border-emerald-200 bg-emerald-50 p-4">
        <p class="font-medium text-emerald-700">
          {{ successMessage() }}
        </p>
      </div>
    }

    <!-- Error -->
    @if (errorMessage()) {
      <div
        class="mb-6 rounded-xl border border-red-200 bg-red-50 p-4">
        <p class="font-medium text-red-700">
          {{ errorMessage() }}
        </p>
      </div>
    }

    <!-- Form -->
    <form
      (ngSubmit)="saveEvent()"
      class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm md:p-8">

      <div class="grid gap-6 md:grid-cols-2">

        <!-- Event Name -->
        <div class="md:col-span-2">
          <label
            for="eventName"
            class="block text-sm font-semibold text-slate-700">
            Event Name
          </label>

          <input
            id="eventName"
            name="name"
            type="text"
            [(ngModel)]="event.name"
            placeholder="Enter event name"
            class="mt-2 w-full rounded-lg border border-slate-300 px-4 py-3 text-sm outline-none transition focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100"
          />
        </div>

        <!-- Venue -->
        <div>
          <label
            for="venue"
            class="block text-sm font-semibold text-slate-700">
            Venue
          </label>

          <select
            id="venue"
            name="venueId"
            [(ngModel)]="event.venueId"
            class="mt-2 w-full rounded-lg border border-slate-300 bg-white px-4 py-3 text-sm outline-none transition focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100">

            <option [ngValue]="0">
              Select venue
            </option>

            @for (venue of venues(); track venue.venueId) {
              <option [ngValue]="venue.venueId">
                {{ venue.name }}
              </option>
            }

          </select>
        </div>

        <!-- Category -->
        <div>
          <label
            for="category"
            class="block text-sm font-semibold text-slate-700">
            Category
          </label>

          <select
            id="category"
            name="categoryId"
            [(ngModel)]="event.categoryId"
            class="mt-2 w-full rounded-lg border border-slate-300 bg-white px-4 py-3 text-sm outline-none transition focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100">

            <option [ngValue]="0">
              Select category
            </option>

            @for (category of categories(); track category.categoryId) {
              <option [ngValue]="category.categoryId">
                {{ category.name }}
              </option>
            }

          </select>
        </div>

        <!-- Event Date -->
        <div>
          <label
            for="eventDate"
            class="block text-sm font-semibold text-slate-700">
            Event Date
          </label>

          <input
            id="eventDate"
            name="eventDate"
            type="date"
            [(ngModel)]="event.eventDate"
            class="mt-2 w-full rounded-lg border border-slate-300 px-4 py-3 text-sm outline-none transition focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100"
          />
        </div>

        <!-- Capacity -->
        <div>
          <label
            for="capacity"
            class="block text-sm font-semibold text-slate-700">
            Capacity
          </label>

          <input
            id="capacity"
            name="capacity"
            type="number"
            min="1"
            [(ngModel)]="event.capacity"
            placeholder="Enter capacity"
            class="mt-2 w-full rounded-lg border border-slate-300 px-4 py-3 text-sm outline-none transition focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100"
          />
        </div>

        <!-- Start Time -->
        <div>
          <label
            for="startTime"
            class="block text-sm font-semibold text-slate-700">
            Start Time
          </label>

          <input
            id="startTime"
            name="startTime"
            type="time"
            [(ngModel)]="event.startTime"
            class="mt-2 w-full rounded-lg border border-slate-300 px-4 py-3 text-sm outline-none transition focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100"
          />
        </div>

        <!-- End Time -->
        <div>
          <label
            for="endTime"
            class="block text-sm font-semibold text-slate-700">
            End Time
          </label>

          <input
            id="endTime"
            name="endTime"
            type="time"
            [(ngModel)]="event.endTime"
            class="mt-2 w-full rounded-lg border border-slate-300 px-4 py-3 text-sm outline-none transition focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100"
          />
        </div>

        <!-- Ticket Price -->
        <div>
          <label
            for="ticketPrice"
            class="block text-sm font-semibold text-slate-700">
            Ticket Price
          </label>

          <input
            id="ticketPrice"
            name="ticketPrice"
            type="number"
            min="0"
            step="0.01"
            [(ngModel)]="event.ticketPrice"
            placeholder="Enter ticket price"
            class="mt-2 w-full rounded-lg border border-slate-300 px-4 py-3 text-sm outline-none transition focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100"
          />
        </div>

        <!-- Parking Fee -->
        <div>
          <label
            for="parkingFee"
            class="block text-sm font-semibold text-slate-700">
            Parking Fee
          </label>

          <input
            id="parkingFee"
            name="parkingFee"
            type="number"
            min="0"
            step="0.01"
            [(ngModel)]="event.parkingFee"
            placeholder="Enter parking fee"
            class="mt-2 w-full rounded-lg border border-slate-300 px-4 py-3 text-sm outline-none transition focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100"
          />
        </div>

      </div>

      <!-- Actions -->
      <div
        class="mt-8 flex flex-col gap-3 border-t border-slate-100 pt-6 sm:flex-row sm:justify-end">

        <button
          type="reset"
          (click)="event = {
            eventId: 0,
            name: '',
            venueId: 0,
            categoryId: 0,
            eventDate: '',
            startTime: '',
            endTime: '',
            ticketPrice: 0,
            parkingFee: 0,
            capacity: 0
          }"
          class="rounded-lg border border-slate-300 px-5 py-3 text-sm font-semibold text-slate-700 transition hover:bg-slate-50">
          Clear
        </button>

        <button
          type="submit"
          [disabled]="isSaving()"
          class="rounded-lg bg-indigo-600 px-6 py-3 text-sm font-semibold text-white transition hover:bg-indigo-700 disabled:cursor-not-allowed disabled:opacity-50">

          @if (isSaving()) {
            Saving...
          } @else {
            Create Event
          }

        </button>

      </div>

    </form>

  </div>
</div>
