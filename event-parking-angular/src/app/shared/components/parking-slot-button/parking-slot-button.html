<button
  type="button"
  class="flex min-h-[80px] w-full flex-col items-center justify-center gap-1.5 rounded-2xl border transition-all duration-200 cursor-pointer active:scale-95 text-center p-3 focus-visible:outline-2 focus-visible:outline-blue-600 focus-visible:outline-offset-2"
  [class.bg-blue-600]="selected"
  [class.text-white]="selected"
  [class.border-blue-600]="selected"
  [class.shadow-md]="selected"
  [class.ring-2]="selected"
  [class.ring-blue-400]="selected"
  [class.bg-white]="isAvailable && !selected"
  [class.text-slate-800]="isAvailable && !selected"
  [class.border-slate-200]="isAvailable && !selected"
  [class.hover:border-blue-500]="isAvailable && !selected"
  [class.hover:shadow-xs]="isAvailable && !selected"
  [class.bg-amber-50]="isHeld"
  [class.text-amber-800]="isHeld"
  [class.border-amber-300]="isHeld"
  [class.bg-slate-100]="isOccupied && !isHeld"
  [class.text-slate-400]="isOccupied && !isHeld"
  [class.border-slate-200]="isOccupied && !isHeld"
  [class.cursor-not-allowed]="!isAvailable"
  [class.opacity-65]="isOccupied && !isHeld"
  [disabled]="!isAvailable"
  [attr.aria-label]="ariaLabel"
  [attr.aria-pressed]="selected"
  (click)="onSlotClick()"
>
  <div class="flex items-center gap-1.5 justify-center">
    <span class="text-sm font-bold font-mono tracking-tight">{{ slotNumber }}</span>
    @if (zone) {
      <span class="text-[10px] px-1.5 py-0.5 rounded font-bold uppercase tracking-wider"
            [class.bg-blue-700]="selected"
            [class.text-white]="selected"
            [class.bg-slate-100]="!selected && isAvailable"
            [class.text-slate-600]="!selected && isAvailable"
            [class.bg-amber-200]="isHeld"
            [class.bg-slate-200]="isOccupied && !isHeld">
        {{ zone }}
      </span>
    }
  </div>

  <div class="flex items-center gap-2 text-[10px] font-semibold uppercase tracking-wider">
    <span class="opacity-90">
      {{ isAvailable ? (selected ? 'Selected' : 'Available') : status }}
    </span>
    @if (fee !== null && fee > 0) {
      <span class="opacity-80">· LKR {{ fee }}</span>
    }
  </div>
</button>
