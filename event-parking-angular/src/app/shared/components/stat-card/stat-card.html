<div class="rounded-2xl border border-slate-200/90 bg-white p-5 sm:p-6 shadow-xs hover:shadow-md transition">
  <div class="flex items-center justify-between gap-4">
    <div class="min-w-0 flex-1">
      <p class="text-xs font-bold uppercase tracking-wider text-slate-500 truncate">
        {{ title }}
      </p>
      <h3 class="mt-1.5 text-2xl sm:text-3xl font-extrabold tracking-tight font-mono" [ngClass]="valueColorClass">
        {{ value }}
      </h3>
      @if (description) {
        <p class="mt-1 text-xs text-slate-400 truncate">
          {{ description }}
        </p>
      }
    </div>

    @if (icon) {
      <div
        class="flex h-12 w-12 shrink-0 items-center justify-center rounded-2xl border shadow-xs"
        [ngClass]="iconBgClass"
        aria-hidden="true"
      >
        @switch (icon) {
          @case ('revenue') {
            <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
          }
          @case ('ticket') {
            <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 00-2 2v3a2 2 0 110 4v3a2 2 0 002 2h14a2 2 0 002-2v-3a2 2 0 110-4V7a2 2 0 00-2-2H5z" />
            </svg>
          }
          @case ('seat') {
            <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
            </svg>
          }
          @case ('parking') {
            <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 17a2 2 0 100 4 2 2 0 000-4zm10 0a2 2 0 100 4 2 2 0 000-4zM5 11l2-5h10l2 5M4 11h16v6H4v-6z" />
            </svg>
          }
          @default {
            <span class="text-xl">{{ icon }}</span>
          }
        }
      </div>
    }
  </div>

  @if (trend) {
    <div class="mt-4 pt-3 border-t border-slate-100 flex items-center gap-1.5 text-xs text-slate-500">
      <span class="font-semibold">{{ trend }}</span>
    </div>
  }
</div>
