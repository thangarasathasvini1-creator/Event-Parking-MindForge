@if (totalPages > 1) {
  <nav class="flex flex-col sm:flex-row items-center justify-between gap-4 py-4" aria-label="Pagination Navigation">
    <div class="text-xs text-slate-500">
      Showing <span class="font-semibold text-slate-800">{{ startItem }}</span> to
      <span class="font-semibold text-slate-800">{{ endItem }}</span> of
      <span class="font-semibold text-slate-800">{{ totalItems }}</span> results
    </div>

    <div class="flex items-center gap-1.5">
      <!-- Previous Button -->
      <button
        type="button"
        (click)="previous()"
        [disabled]="currentPage === 1"
        aria-label="Previous Page"
        class="inline-flex items-center justify-center rounded-xl border border-slate-200 bg-white px-3 py-2 text-xs font-semibold text-slate-700 shadow-2xs transition hover:bg-slate-50 disabled:cursor-not-allowed disabled:opacity-40"
      >
        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m15 18-6-6 6-6"/>
        </svg>
        <span class="ml-1 hidden sm:inline">Previous</span>
      </button>

      <!-- Page Numbers -->
      @for (page of pages; track $index) {
        @if (page === -1 || page === -2) {
          <span class="px-2 text-xs text-slate-400 font-semibold" aria-hidden="true">…</span>
        } @else {
          <button
            type="button"
            (click)="selectPage(page)"
            [attr.aria-current]="page === currentPage ? 'page' : null"
            [class.bg-blue-600]="page === currentPage"
            [class.text-white]="page === currentPage"
            [class.border-blue-600]="page === currentPage"
            [class.shadow-xs]="page === currentPage"
            [class.bg-white]="page !== currentPage"
            [class.text-slate-700]="page !== currentPage"
            [class.border-slate-200]="page !== currentPage"
            [class.hover:bg-slate-50]="page !== currentPage"
            class="h-9 w-9 rounded-xl border text-xs font-bold transition flex items-center justify-center cursor-pointer"
          >
            {{ page }}
          </button>
        }
      }

      <!-- Next Button -->
      <button
        type="button"
        (click)="next()"
        [disabled]="currentPage === totalPages"
        aria-label="Next Page"
        class="inline-flex items-center justify-center rounded-xl border border-slate-200 bg-white px-3 py-2 text-xs font-semibold text-slate-700 shadow-2xs transition hover:bg-slate-50 disabled:cursor-not-allowed disabled:opacity-40"
      >
        <span class="mr-1 hidden sm:inline">Next</span>
        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m9 18 6-6-6-6"/>
        </svg>
      </button>
    </div>
  </nav>
}
