<div class="rounded-2xl border border-slate-200 bg-white p-10 text-center shadow-sm">
  <div class="mx-auto flex h-16 w-16 items-center justify-center rounded-full bg-slate-100 text-slate-400">
    <svg class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
      <path stroke-linecap="round" stroke-linejoin="round" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4" />
    </svg>
  </div>
  <h3 class="mt-4 text-base font-bold text-slate-900">{{ title }}</h3>
  <p class="mt-1.5 text-xs text-slate-500 max-w-sm mx-auto leading-relaxed">{{ description }}</p>
  @if (actionText) {
    <button
      type="button"
      (click)="onAction()"
      class="mt-5 rounded-xl bg-blue-600 px-4 py-2.5 text-xs font-semibold text-white shadow-sm transition hover:bg-blue-700"
    >
      {{ actionText }}
    </button>
  }
</div>
