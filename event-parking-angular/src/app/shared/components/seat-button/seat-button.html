<button
  type="button"
  class="relative w-11 h-11 sm:w-13 sm:h-12 rounded-xl border text-xs sm:text-sm font-bold transition-all duration-200 flex flex-col items-center justify-center active:scale-95 focus-visible:outline-2 focus-visible:outline-blue-600 focus-visible:outline-offset-2"
  [class.cursor-pointer]="isAvailable"
  [class.bg-blue-600]="selected"
  [class.text-white]="selected"
  [class.border-blue-600]="selected"
  [class.shadow-md]="selected"
  [class.ring-2]="selected"
  [class.ring-blue-400]="selected"
  [class.bg-white]="isAvailable && !selected"
  [class.text-slate-800]="isAvailable && !selected"
  [class.border-slate-300]="isAvailable && !selected"
  [class.hover:border-blue-500]="isAvailable && !selected"
  [class.hover:text-blue-600]="isAvailable && !selected"
  [class.hover:shadow-xs]="isAvailable && !selected"
  [class.bg-purple-900/10]="isVIP"
  [class.text-amber-600]="isVIP"
  [class.border-amber-400/80]="isVIP"
  [class.bg-amber-100]="isHeld"
  [class.text-amber-800]="isHeld"
  [class.border-amber-300]="isHeld"
  [class.bg-slate-200]="isBooked && !isHeld && !isVIP"
  [class.text-slate-400]="isBooked && !isHeld && !isVIP"
  [class.border-slate-200]="isBooked && !isHeld && !isVIP"
  [class.cursor-not-allowed]="!isAvailable"
  [class.opacity-60]="isBooked && !isHeld && !isVIP"
  [disabled]="!isAvailable"
  (click)="onSeatClick()"
  [attr.aria-label]="ariaLabel"
  [attr.aria-pressed]="selected"
>
  <span class="leading-none">{{ seatNumber }}</span>
  @if (isHeld) {
    <span class="text-[9px] font-semibold tracking-tighter uppercase leading-none mt-0.5 text-amber-700">Held</span>
  }
  @if (isVIP) {
    <span class="text-[8px] font-black tracking-widest uppercase leading-none mt-0.5 text-amber-600 bg-amber-100/90 px-1 py-0.2 rounded shadow-2xs">VIP</span>
  }
</button>
