<button
  type="button"
  class="relative w-11 h-11 sm:w-13 sm:h-12 rounded-xl border text-xs sm:text-sm font-bold transition-all duration-200 flex flex-col items-center justify-center cursor-pointer active:scale-95 focus-visible:outline-2 focus-visible:outline-blue-600 focus-visible:outline-offset-2"
  [class.bg-blue-600]="selected"
  [class.text-white]="selected"
  [class.border-blue-600]="selected"
  [class.shadow-md]="selected"
  [class.ring-2]="selected"
  [class.ring-blue-400]="selected"
  [class.bg-white]="isAvailable && !selected"
  [class.text-slate-800]="isAvailable && !selected"
  [class.border-slate-300]="isAvailable && !selected"
  [class.hover:border-blue-500]="isAvailable && !selected"
  [class.hover:text-blue-600]="isAvailable && !selected"
  [class.hover:shadow-xs]="isAvailable && !selected"
  [class.bg-amber-100]="isHeld"
  [class.text-amber-800]="isHeld"
  [class.border-amber-300]="isHeld"
  [class.bg-slate-200]="isBooked && !isHeld"
  [class.text-slate-400]="isBooked && !isHeld"
  [class.border-slate-200]="isBooked && !isHeld"
  [class.cursor-not-allowed]="!isAvailable"
  [class.opacity-60]="isBooked && !isHeld"
  [disabled]="!isAvailable"
  (click)="onSeatClick()"
  [attr.aria-label]="ariaLabel"
  [attr.aria-pressed]="selected"
>
  <span class="leading-none">{{ seatNumber }}</span>
  @if (isHeld) {
    <span class="text-[9px] font-semibold tracking-tighter uppercase leading-none mt-0.5 text-amber-700">Held</span>
  }
</button>
