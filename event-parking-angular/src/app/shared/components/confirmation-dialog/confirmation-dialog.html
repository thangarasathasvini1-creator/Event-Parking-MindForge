<div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/60 backdrop-blur-xs" role="presentation">
  <section class="max-w-md w-full bg-white rounded-3xl border border-slate-200/90 shadow-2xl p-6 sm:p-8" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
    <h2 id="dialog-title" class="text-xl font-extrabold text-slate-900 tracking-tight">
      {{ title }}
    </h2>
    <p class="mt-2.5 mb-6 text-sm text-slate-600 leading-relaxed">
      {{ message }}
    </p>

    <div class="flex items-center justify-end gap-3">
      <button
        type="button"
        [disabled]="busy"
        (click)="cancelled.emit()"
        class="px-4 py-2.5 rounded-xl border border-slate-200 hover:bg-slate-50 text-slate-700 text-xs font-bold transition disabled:opacity-50 cursor-pointer"
      >
        Cancel
      </button>

      <button
        type="button"
        [disabled]="busy"
        (click)="confirmed.emit()"
        class="px-5 py-2.5 rounded-xl bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white text-xs font-bold shadow-sm transition active:scale-[0.98] disabled:opacity-50 cursor-pointer flex items-center gap-2"
      >
        @if (busy) {
          <span class="w-3.5 h-3.5 border-2 border-white/40 border-t-white rounded-full animate-spin"></span>
        }
        <span>{{ busy ? 'Processing...' : confirmLabel }}</span>
      </button>
    </div>
  </section>
</div>
